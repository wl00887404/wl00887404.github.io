<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>時間熱力圖</title>
<style>
  :root {
    --accent: 255, 71, 85; /* #FF4655 */
  }
  * { box-sizing: border-box; }
  body {
    background: #0f1115;
    color: #e8e8ea;
    font-family: -apple-system, "Segoe UI", "Microsoft JhengHei", sans-serif;
    padding: 24px;
  }
  h1 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
  .subtitle { color: #888; font-size: 13px; margin-bottom: 24px; }

  .day-block {
    margin-bottom: 32px;
    background: #1a1c22;
    border: 1px solid #2a2d35;
    border-radius: 10px;
    padding: 16px 20px 20px;
    overflow-x: auto;
  }
  .day-title {
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    margin-bottom: 12px;
    letter-spacing: 0.3px;
  }
  .day-title .count {
    color: #888;
    font-weight: 400;
    font-size: 12px;
    margin-left: 8px;
  }

  table.heatmap {
    border-collapse: collapse;
    font-size: 10px;
    min-width: 720px;
  }
  table.heatmap th, table.heatmap td {
    text-align: center;
    padding: 0;
  }
  .hour-label {
    color: #888;
    font-size: 10px;
    font-weight: 500;
    padding-bottom: 4px !important;
    width: 26px;
  }
  .quarter-label {
    color: #888;
    font-size: 10px;
    text-align: right !important;
    padding-right: 8px !important;
    width: 34px;
    white-space: nowrap;
  }
  .cell {
    width: 22px;
    height: 22px;
    border-radius: 3px;
    border: 1px solid #26282f;
    background-color: #1e2027;
    cursor: default;
    transition: transform 0.08s ease;
  }
  .cell.has-data:hover {
    outline: 1.5px solid rgba(var(--accent), 1);
    transform: scale(1.15);
    position: relative;
    z-index: 2;
  }
  td.cell-wrap { padding: 1.5px !important; }

  #tooltip {
    position: fixed;
    pointer-events: none;
    background: #22242b;
    border: 1px solid #3a3d46;
    color: #fff;
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 12px;
    line-height: 1.5;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    display: none;
    z-index: 10;
    white-space: nowrap;
  }
  #tooltip .row { display: flex; gap: 6px; align-items: baseline; }
  #tooltip .row + .row { margin-top: 2px; }
  #tooltip .label { font-weight: 600; }
  #tooltip .time { color: rgba(var(--accent), 1); font-variant-numeric: tabular-nums; }

  .legend {
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 4px 0 24px;
    font-size: 12px;
    color: #888;
  }
  .legend .box {
    width: 14px;
    height: 14px;
    border-radius: 3px;
    border: 1px solid #26282f;
  }
</style>
</head>
<body>

<h1>時間熱力圖</h1>
<div class="subtitle">每格代表 15 分鐘，顏色深淺代表當日該時段的資料筆數</div>

<div class="legend">
  少
  <div class="box" style="background:rgba(var(--accent),0)"></div>
  <div class="box" style="background:rgba(var(--accent),0.35)"></div>
  <div class="box" style="background:rgba(var(--accent),0.7)"></div>
  <div class="box" style="background:rgba(var(--accent),1)"></div>
  多
</div>

<div id="heatmap-root"></div>
<div id="tooltip"></div>

/* =========================================================
   2. 解析 ISO 字串 -> { dateKey, hour, quarter, timeLabel }
   全部以「使用者瀏覽器的本地時區」為準（new Date 會自動轉換，
   再用 getFullYear/getMonth/getDate/getHours/getMinutes 取本地值）
   ========================================================= */
function pad2(n) {
  return String(n).padStart(2, '0');
}

function parseRecord(record) {
  const [id, label, iso] = record;
  const d = new Date(iso);
  if (isNaN(d.getTime())) return null;

  const dateKey = `${d.getFullYear()}/${pad2(d.getMonth() + 1)}/${pad2(d.getDate())}`;
  const hour = d.getHours();
  const minute = d.getMinutes();
  const quarter = Math.floor(minute / 15); // 0~3
  const timeLabel = `${pad2(hour)}:${pad2(minute)}`;
  return { id, label, dateKey, hour, quarter, timeLabel };
}

/* =========================================================
   3. 依日期分組，再依 [hour][quarter] 分桶
   ========================================================= */
function buildDayMap(records) {
  const dayMap = {}; // dateKey -> hour -> quarter -> [items]
  for (const raw of records) {
    const r = parseRecord(raw);
    if (!r) continue;
    if (!dayMap[r.dateKey]) {
      dayMap[r.dateKey] = Array.from({ length: 24 }, () =>
        Array.from({ length: 4 }, () => [])
      );
    }
    dayMap[r.dateKey][r.hour][r.quarter].push(r);
  }
  return dayMap;
}

/* =========================================================
   4. Alpha 分級：0 筆 -> 0, 1 -> 0.35, 2 -> 0.7, 3+ -> 1
   ========================================================= */
function alphaForCount(count) {
  const steps = [0, 0.35, 0.7, 1];
  return steps[Math.min(count, 3)];
}

/* =========================================================
   5. 畫圖
   ========================================================= */
const QUARTER_LABELS = [':00', ':15', ':30', ':45'];

function renderHeatmap(dayMap) {
  const root = document.getElementById('heatmap-root');
  root.innerHTML = '';

  const dateKeys = Object.keys(dayMap).sort();

  for (const dateKey of dateKeys) {
    const hours = dayMap[dateKey];
    const totalCount = hours.flat(2).length;

    const block = document.createElement('div');
    block.className = 'day-block';

    const title = document.createElement('div');
    title.className = 'day-title';
    title.textContent = dateKey;
    const countSpan = document.createElement('span');
    countSpan.className = 'count';
    countSpan.textContent = `共 ${totalCount} 筆`;
    title.appendChild(countSpan);
    block.appendChild(title);

    const table = document.createElement('table');
    table.className = 'heatmap';

    // 表頭：小時 0~23
    const headRow = document.createElement('tr');
    headRow.appendChild(document.createElement('th')); // 對齊左側時間標籤欄
    for (let h = 0; h < 24; h++) {
      const th = document.createElement('th');
      th.className = 'hour-label';
      th.textContent = pad2(h);
      headRow.appendChild(th);
    }
    table.appendChild(headRow);

    // 四列：00 / 15 / 30 / 45
    for (let q = 0; q < 4; q++) {
      const tr = document.createElement('tr');
      const rowLabel = document.createElement('td');
      rowLabel.className = 'quarter-label';
      rowLabel.textContent = QUARTER_LABELS[q];
      tr.appendChild(rowLabel);

      for (let h = 0; h < 24; h++) {
        const items = hours[h][q];
        const alpha = alphaForCount(items.length);

        const td = document.createElement('td');
        td.className = 'cell-wrap';

        const cell = document.createElement('div');
        cell.className = 'cell' + (items.length > 0 ? ' has-data' : '');
        cell.style.backgroundColor = `rgba(var(--accent), ${alpha})`;

        if (items.length > 0) {
          cell.addEventListener('mouseenter', (e) => showTooltip(e, items));
          cell.addEventListener('mousemove', moveTooltip);
          cell.addEventListener('mouseleave', hideTooltip);
        }

        td.appendChild(cell);
        tr.appendChild(td);
      }
      table.appendChild(tr);
    }

    block.appendChild(table);
    root.appendChild(block);
  }
}

/* =========================================================
   6. Tooltip：label + HH:mm，多筆資料則列出多列
   ========================================================= */
const tooltipEl = document.getElementById('tooltip');

function showTooltip(e, items) {
  tooltipEl.innerHTML = items
    .map(it => `<div class="row"><span class="label">${escapeHtml(it.label)}</span><span class="time">${it.timeLabel}</span></div>`)
    .join('');
  tooltipEl.style.display = 'block';
  moveTooltip(e);
}

function moveTooltip(e) {
  const offset = 14;
  tooltipEl.style.left = e.clientX + offset + 'px';
  tooltipEl.style.top = e.clientY + offset + 'px';
}

function hideTooltip() {
  tooltipEl.style.display = 'none';
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

/* =========================================================
   7. 初始化
   ========================================================= */
const dayMap = buildDayMap(rawData);
renderHeatmap(dayMap);
